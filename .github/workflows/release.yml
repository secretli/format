name: Release

# A tag v0.1.2 releases both implementations at that version. For Go the tag
# itself is the release: the Go module proxy serves it from here. For
# TypeScript the workflow packs ts/ and attaches the archive to the GitHub
# release, signed with a build attestation; consumers depend on the
# archive's URL. Nothing is published to a package registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and attach the archive
      id-token: write # sign the attestation
      attestations: write # store the attestation
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: The package version is the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "package.json says ${version}, the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          npm pack --pack-destination "$RUNNER_TEMP/dist"
          echo "ARCHIVE=$RUNNER_TEMP/dist/secretli-format-${VERSION}.tgz" >> "$GITHUB_ENV"

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/secretli-format-${VERSION}.tgz"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **Go:** \`go get github.com/secretli/format@${GITHUB_REF_NAME}\`

          **TypeScript:** add the attached archive as a dependency, for example with pnpm:

          \`\`\`bash
          pnpm add ${url}
          \`\`\`

          The archive carries a build attestation from this repository's release workflow. To check a downloaded copy:

          \`\`\`bash
          gh attestation verify secretli-format-${VERSION}.tgz --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "format ${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes \
            "$ARCHIVE"
